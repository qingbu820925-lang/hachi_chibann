<style>
html, body, #map {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}
.ol-zoom { display:none; }

/* ===== ログイン画面 ===== */
#loginOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
}
#loginBox {
    background: #fff;
    width: 280px;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    text-align: center;
}
#loginBox h2 {
    margin: 0 0 10px;
    font-size: 18px;
}
#loginBox input {
    width: 100%;
    padding: 8px;
    font-size: 14px;
    margin-top: 8px;
    box-sizing: border-box;
}
#loginBox button {
    width: 100%;
    margin-top: 12px;
    padding: 8px;
    font-size: 14px;
    cursor: pointer;
}
#loginError {
    color: red;
    font-size: 12px;
    margin-top: 8px;
    display: none;
}
</style>
</head>

<body>

<!-- ===== ログイン画面 ===== -->
<div id="loginOverlay">
    <div id="loginBox">
        <h2>ログイン</h2>
        <div>パスワードを入力してください</div>
        <input type="password" id="passwordInput" placeholder="Password">
        <button onclick="checkPassword()">ログイン</button>
        <div id="loginError">パスワードが違います</div>
    </div>
</div>

<!-- ===== 地図 ===== -->
<div id="map">
    <div id="popup" class="ol-popup">
        <a href="#" id="popup-closer" class="ol-popup-closer"></a>
        <div id="popup-content"></div>
    </div>
</div>

<script>
/* ===== 設定 ===== */
const CORRECT_PASSWORD = "8JO-4cho";
const LOGIN_TIME_KEY = "hachijo_login_time";
//const EXPIRE_MS = 24 * 60 * 60 * 1000; // 1日（24時間）
const EXPIRE_MS = 24 * 30 * 60 * 60 * 1000; // 30日


/* ===== 初期チェック ===== */
window.addEventListener("load", () => {
    const loginTime = localStorage.getItem(LOGIN_TIME_KEY);

    if (loginTime) {
        const now = Date.now();
        const elapsed = now - Number(loginTime);

        if (elapsed < EXPIRE_MS) {
            // 有効期限内 → ログイン済み
            document.getElementById("loginOverlay").style.display = "none";
            return;
        } else {
            // 期限切れ → 削除
            localStorage.removeItem(LOGIN_TIME_KEY);
        }
    }
});

/* ===== パスワード判定 ===== */
function checkPassword() {
    const input = document.getElementById("passwordInput").value;

    if (input === CORRECT_PASSWORD) {
        localStorage.setItem(LOGIN_TIME_KEY, Date.now()); // ★ ログイン時刻保存
        document.getElementById("loginOverlay").style.display = "none";
    } else {
        document.getElementById("loginError").style.display = "block";
    }
}

/* ===== Enterキー対応 ===== */
document.getElementById("passwordInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        e.preventDefault();
        checkPassword();
    }
});
</script>
